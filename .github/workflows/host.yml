name: Host Wafer Desk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is out of sync with package.json, so `npm ci` fails.
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Render a static page for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # `vite` is only on PATH inside npm scripts, so go through `npm run`.
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /tmp/index.html http://127.0.0.1:4173/ && break
            sleep 0.5
          done
          test -s /tmp/index.html || { cat /tmp/preview.log; exit 1; }
          python3 - << 'PY'
          import os, re
          from pathlib import Path
          # Project Pages are served from /<repo>/, not the domain root.
          base = "/" + os.environ["REPO_NAME"] + "/"
          html = Path("/tmp/index.html").read_text(encoding="utf-8")
          # Covers <link href>, <script src> AND the "/assets/..." strings inside
          # the inline TanStack Start bootstrap script.
          html = re.sub(
              r'(["\'])/(assets/|__grok/|favicon\.svg)',
              lambda m: m.group(1) + base + m.group(2),
              html,
          )
          out = Path(".vercel/output/static")
          (out / "index.html").write_text(html, encoding="utf-8")
          (out / "404.html").write_text(html, encoding="utf-8")
          (out / ".nojekyll").write_text("", encoding="utf-8")
          PY
          kill %1 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

      - id: deployment
        uses: actions/deploy-pages@v4